<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MZ Marketing Agency Admin Panel</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#0A1A34;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:24px}
  .box{max-width:420px}.box img{width:56px;margin-bottom:18px}.box h1{font-size:1.3rem;margin-bottom:10px}
  .box p{color:#B9C4E0;font-size:.92rem;line-height:1.6}.box button{margin-top:18px;background:#FF6A2B;color:#fff;border:none;padding:12px 26px;border-radius:999px;font-weight:600;font-size:.95rem;cursor:pointer}
</style>
</head>
<body>
<div class="box" id="fallback">
  <img src="../assets/images/logo-mz-marketing-agency.png" alt="MZ Marketing Agency">
  <h1>MZ Marketing Agency Admin Panel</h1>
  <p id="status">Loading the secure login screen.</p>
  <button id="open-login" type="button">Open Login</button>
</div>

<script>
(function () {
  function hasAuthToken() {
    return /(^|#)(invite_token|recovery_token|confirmation_token|email_change_token|access_token)=/.test(window.location.hash);
  }

  function openIdentity() {
    if (window.netlifyIdentity) {
      window.netlifyIdentity.open();
    }
  }

  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function (user) {
      var status = document.getElementById("status");
      var button = document.getElementById("open-login");

      if (button) button.onclick = openIdentity;

      if (hasAuthToken()) {
        if (status) status.textContent = "Opening the secure account screen.";
        setTimeout(openIdentity, 100);
        return;
      }

      if (user) {
        var fallback = document.getElementById("fallback");
        if (fallback) fallback.style.display = "none";
      } else if (status) {
        status.textContent = "Use your Netlify Identity email and password to access the Admin Panel.";
      }

      window.netlifyIdentity.on("login", function () {
        window.location.href = "/admin/";
      });
    });
  }
})();
</script>

<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
